[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vqi"
version = "0.1.0"
description = "Visual quality inspection: anomaly detection trained on good parts only, with an audited decision log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Burak Aytaş" }]
# Core dependencies: no deep-learning stack, so CI and the API container stay small.
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scikit-learn==1.9.1",
    "opencv-python-headless==5.0.0.93",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
# GPU notebooks (Colab / Kaggle): training and evaluation.
train = [
    "anomalib==2.7.0",
    "torch==2.14.1",
    "torchvision==0.29.2",
]
# Model export and CPU inference benchmarks.
export = [
    "onnx==1.23.2",
    "onnxruntime==1.31.1",
    "openvino==2026.4.1",
    "nncf==3.4.0",
]
# Line integration: inspection API and operator panel.
serve = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "streamlit==1.66.1",
]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "D", "SIM", "RUF"]
ignore = [
    "D100", # module docstrings are written where they add something
    "D104", # package docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
