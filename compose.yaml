# The inspection API, a simulated camera that posts every image dropped into incoming/,
# and the operator panel on http://localhost:8501.
#   VQI_GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up --build
# Needs the exported model in exports/ (scripts/export_model.py); decisions go to logs/.
x-build: &build
  context: .
  args:
    VQI_GIT_COMMIT: ${VQI_GIT_COMMIT:-unknown}

services:
  api:
    build: *build
    ports:
      - "8000:8000"
    volumes:
      - ./exports:/app/exports:ro
      - ./results:/app/results:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 5s
      timeout: 5s
      retries: 12

  line:
    build: *build
    command: ["python", "scripts/line_simulator.py", "--folder", "/app/incoming", "--url", "http://api:8000"]
    volumes:
      - ./incoming:/app/incoming:ro
    depends_on:
      api:
        condition: service_healthy

  panel:
    build: *build
    command: ["streamlit", "run", "src/vqi/panel.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      VQI_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
